[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-tools"
description = "Command-line toolkit to inspect, extract, zipalign and sign Android APKs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "josephrltpa" }]
keywords = ["android", "apk", "apksigner", "zipalign", "reverse-engineering"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
apk-tools = "apk_tools.cli:main"

[tool.setuptools.dynamic]
version = { attr = "apk_tools.__version__" }

[tool.setuptools.packages.find]
include = ["apk_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
